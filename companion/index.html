<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>DeepSeek Agent Companion</title>
<style>
  :root{--pri:#4d6bff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:#0f1117;color:#e6e8ef;height:100vh;display:flex;flex-direction:column}
  header{background:#171a24;border-bottom:1px solid #262a38;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
  header .sp{flex:1}
  header .q{font-size:11.5px;color:#8a90a6;font-weight:400}
  .bar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:#141722;border-bottom:1px solid #262a38;font-size:12.5px;flex-wrap:wrap}
  .bar .path{flex:1;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#0f1117;border:1px solid #262a38;border-radius:7px;padding:5px 9px;color:#a9b0c6}
  label.ck{display:flex;align-items:center;gap:5px;cursor:pointer}
  button{font:inherit;cursor:pointer}
  .btn{background:#232838;color:#dfe3f0;border:1px solid #313850;border-radius:8px;padding:6px 12px;font-size:12.5px}
  .btn:hover{background:#2b3247}
  .btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
  #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px}
  .msg{max-width:820px;padding:10px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.55;font-size:14px}
  .user{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:#1c2030;border:1px solid #2a2f42;border-bottom-left-radius:4px}
  .acts{align-self:flex-start;font-size:11.5px;color:#7fd0a0;background:#0e1710;border:1px solid #1e3020;border-radius:8px;padding:6px 10px;white-space:pre-wrap;font-family:ui-monospace,monospace}
  pre.code{background:#0a0d16;border:1px solid #232a3d;border-radius:8px;padding:10px;overflow-x:auto;font-family:ui-monospace,monospace;font-size:12.5px;color:#cfe4ff;margin:6px 0}
  .foot{border-top:1px solid #262a38;padding:10px 14px;display:flex;gap:8px;background:#141722}
  textarea{flex:1;resize:none;background:#0f1117;border:1px solid #2a2f42;border-radius:10px;color:#fff;padding:10px 12px;font:inherit;font-size:14px;height:46px}
  textarea:focus{outline:none;border-color:var(--pri)}
  #login{position:fixed;inset:0;background:#0f1117;display:flex;align-items:center;justify-content:center;z-index:100}
  #login .box{background:#1a1b2e;border:1px solid #2c2d44;border-radius:16px;padding:26px;width:340px}
  #login input,#login select{width:100%;background:#0f1117;border:1px solid #2a2f42;border-radius:9px;color:#fff;padding:10px 12px;font:inherit;margin-bottom:8px}
  #login input:focus{outline:none;border-color:var(--pri)}
  .hint{color:#8a90a6;font-size:13px;text-align:center;margin:auto}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h2 style="margin:0 0 4px;font-size:17px">🖥️ Agent Companion</h2>
    <div style="color:#8a90a6;font-size:12px;margin-bottom:14px">ล็อกอินไปที่ server เพื่อใช้ AI (token กลาง)</div>
    <select id="lg_url">
      <option value="https://ai.charoenlap.com" selected>https://ai.charoenlap.com (หลัก)</option>
      <option value="http://localhost:4040">http://localhost:4040 (เครื่องนี้)</option>
    </select>
    <input id="lg_email" placeholder="email">
    <input id="lg_pass" type="password" placeholder="password">
    <button class="btn pri" style="width:100%;margin-top:4px" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div style="display:flex;align-items:center;gap:8px;color:#5a6078;font-size:11.5px;margin:12px 0"><span style="flex:1;height:1px;background:#2a2f42"></span>หรือ<span style="flex:1;height:1px;background:#2a2f42"></span></div>
    <button class="btn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px" onclick="doGoogle()"><svg width="17" height="17" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.600l7.1 5.5c4.1-3.8 6.6-9.4 6.6-16.1z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.2l-7.3 5.6C7.9 40.9 15.3 46 24 46z"/><path fill="#FBBC05" d="M11.6 27.9c-.4-1.3-.7-2.6-.7-4s.2-2.7.7-4l-7.3-5.6C2.9 17.3 2 20.5 2 24s.9 6.7 2.3 9.6l7.3-5.7z"/><path fill="#EA4335" d="M24 10.8c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.1 30 2 24 2 15.3 2 7.9 7.1 4.3 14.4l7.3 5.6C13.3 14.7 18.2 10.8 24 10.8z"/></svg> เข้าสู่ระบบด้วย Google</button>
    <div id="lg_msg" style="font-size:12px;color:#ff8a8a;margin-top:8px"></div>
  </div>
</div>

<header>
  🖥️ <span>Agent Companion</span>
  <span class="q" id="whoq"></span>
  <div class="sp"></div>
  <button class="btn" onclick="logout()">ออก</button>
</header>
<div class="bar">
  <span>📁</span><span class="path" id="rootpath">— ยังไม่เลือกโฟลเดอร์ —</span>
  <button class="btn" onclick="pickFolder()">เลือกโฟลเดอร์</button>
  <label class="ck"><input type="checkbox" id="allowWrite" checked> ✏️ แก้ไฟล์</label>
  <label class="ck" style="color:#ffb98a"><input type="checkbox" id="allowShell"> ⌨️ รันคำสั่ง</label>
</div>
<div id="chat"><div class="hint">เลือกโฟลเดอร์ แล้วสั่งงานได้เลย — ไฟล์ทำงานในเครื่องคุณ, AI คิดผ่าน server</div></div>
<div class="foot">
  <textarea id="inp" placeholder="สั่งงาน... (Enter ส่ง)"></textarea>
  <button class="btn pri" id="sendBtn" onclick="send()" style="padding:0 20px">ส่ง</button>
</div>

<script>
const fs = require('fs'), path = require('path'), { execSync, spawn } = require('child_process'), { ipcRenderer } = require('electron');
const JOBS = {}; // background jobs ในเครื่อง
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let serverUrl = '', token = '', root = '', messages = [];

// ---- login ----
async function doLogin(){
  serverUrl = $('lg_url').value.replace(/\/$/, '');
  try{
    const d = await fetch(serverUrl + '/api/auth/login', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ email:$('lg_email').value.trim(), password:$('lg_pass').value }) }).then(r=>r.json());
    if(d.error){ $('lg_msg').textContent = d.error; return; }
    token = d.token; $('login').style.display='none';
    setQ(d.user.used, d.user.quota);
  }catch(e){ $('lg_msg').textContent = 'ต่อ server ไม่ได้: ' + e.message; }
}
async function doGoogle(){
  serverUrl = $('lg_url').value.replace(/\/$/, '');
  $('lg_msg').style.color='#8a90a6'; $('lg_msg').textContent='กำลังเปิด Google ใน browser...';
  try{
    const idToken = await ipcRenderer.invoke('google-login');
    const d = await fetch(serverUrl + '/api/auth/google', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ credential: idToken }) }).then(r=>r.json());
    if(d.error){ $('lg_msg').style.color='#ff8a8a'; $('lg_msg').textContent = d.error; return; }
    token = d.token; $('login').style.display='none'; setQ(d.user.used, d.user.quota);
  }catch(e){ $('lg_msg').style.color='#ff8a8a'; $('lg_msg').textContent = 'Google login: ' + e.message; }
}
function logout(){ token=''; messages=[]; $('login').style.display='flex'; }
function setQ(used, quota){ $('whoq').textContent = 'token: ' + (used||0) + (quota>0?(' / '+quota):' (ไม่จำกัด)'); }
async function pickFolder(){ const p = await ipcRenderer.invoke('pick-folder'); if(p){ root=p; $('rootpath').textContent=p; } }

// ---- tools (รันในเครื่อง user) ----
function safe(p){ const abs=path.resolve(root, p||'.'); if(abs!==root && !abs.startsWith(root+path.sep)) throw new Error('path นอกโฟลเดอร์'); return abs; }
function runTool(name, a){
  if(name==='notify'){ add('bot', fmt(a.message||'')); $('chat').scrollTop=1e9; return 'แจ้ง user แล้ว'; }
  if(name==='bg_list') return Object.values(JOBS).map(j=>j.id+' ['+j.status+'] '+j.cmd.slice(0,50)).join('\n')||'ไม่มี background job';
  if(name==='bg_start'){ if(!$('allowShell').checked) return 'ปฏิเสธ: ปิดรันคำสั่ง'; if(/rm\s+-rf\s+[\/~]|mkfs|dd\s+if=|shutdown|reboot|sudo/i.test(a.command)) return 'ปฏิเสธ: อันตราย'; const id='j'+Date.now().toString(36); const proc=spawn('bash',['-c',a.command],{cwd:root}); const job={id,cmd:a.command,status:'running',out:[],started:Date.now(),proc}; proc.stdout.on('data',d=>job.out.push(d.toString())); proc.stderr.on('data',d=>job.out.push(d.toString())); proc.on('exit',c=>job.status='exited:'+c); JOBS[id]=job; return 'เริ่ม background job id='+id+' (ใช้ bg_status ดูความคืบหน้า)'; }
  if(name.startsWith('bg_')){ const j=JOBS[a.id]; if(!j) return 'ไม่พบ job '+a.id; const secs=Math.round((Date.now()-j.started)/1000);
    if(name==='bg_status') return 'id='+j.id+' status='+j.status+' รัน '+secs+'วิ\n'+ (j.out.join('').slice(-2000)||'(ยังไม่มี output)');
    if(name==='bg_output') return j.out.join('').slice(-8000)||'(ยังไม่มี output)';
    if(name==='bg_stop'){ try{j.proc.kill('SIGTERM')}catch{} j.status='stopped'; return 'หยุด '+j.id; }
    if(name==='bg_pause'){ try{j.proc.kill('SIGSTOP')}catch{} j.status='paused'; return 'พัก '+j.id; }
    if(name==='bg_resume'){ try{j.proc.kill('SIGCONT')}catch{} j.status='running'; return 'ต่อ '+j.id; } }
  if(name==='list_dir') return fs.readdirSync(safe(a.path),{withFileTypes:true}).filter(d=>!d.name.startsWith('.')).map(d=>d.name+(d.isDirectory()?'/':'')).join('\n')||'(ว่าง)';
  if(name==='read_file') return fs.readFileSync(safe(a.path),'utf8').slice(0,100000);
  if(name==='write_file'){ if(!$('allowWrite').checked) return 'ปฏิเสธ: โหมดอ่านอย่างเดียว'; const abs=safe(a.path); fs.mkdirSync(path.dirname(abs),{recursive:true}); if(fs.existsSync(abs)) fs.copyFileSync(abs,abs+'.bak'); fs.writeFileSync(abs,a.content); return 'เขียนสำเร็จ'; }
  if(name==='run_command'){ if(!$('allowShell').checked) return 'ปฏิเสธ: ปิดรันคำสั่ง'; if(/rm\s+-rf\s+[\/~]|mkfs|dd\s+if=|shutdown|reboot|sudo/i.test(a.command)) return 'ปฏิเสธ: คำสั่งอันตราย'; try{ return execSync(a.command,{cwd:root,timeout:60000,maxBuffer:2e6}).toString().slice(0,8000)||'(ไม่มี output)'; }catch(e){ return 'ERROR: '+String(e.stderr||e.message).slice(0,2000); } }
  throw new Error('unknown tool '+name);
}
const TOOLS = [
  {type:'function',function:{name:'list_dir',description:'ลิสต์ไฟล์/โฟลเดอร์',parameters:{type:'object',properties:{path:{type:'string'}},required:['path']}}},
  {type:'function',function:{name:'read_file',description:'อ่านไฟล์',parameters:{type:'object',properties:{path:{type:'string'}},required:['path']}}},
  {type:'function',function:{name:'write_file',description:'เขียน/สร้างไฟล์ (backup อัตโนมัติ)',parameters:{type:'object',properties:{path:{type:'string'},content:{type:'string'}},required:['path','content']}}},
  {type:'function',function:{name:'run_command',description:'รันคำสั่ง shell ในโฟลเดอร์',parameters:{type:'object',properties:{command:{type:'string'}},required:['command']}}},
  {type:'function',function:{name:'notify',description:'ส่งข้อความ/ความคืบหน้าให้ user ทันที (บอกแผน+เวลาที่ประเมินก่อนเริ่ม, อัปเดตระหว่างงานยาว)',parameters:{type:'object',properties:{message:{type:'string'}},required:['message']}}},
  {type:'function',function:{name:'bg_start',description:'รันคำสั่งยาวเป็น background job (คืน id)',parameters:{type:'object',properties:{command:{type:'string'}},required:['command']}}},
  {type:'function',function:{name:'bg_status',description:'สถานะ+output ล่าสุดของ job',parameters:{type:'object',properties:{id:{type:'string'}},required:['id']}}},
  {type:'function',function:{name:'bg_output',description:'output ทั้งหมดของ job',parameters:{type:'object',properties:{id:{type:'string'}},required:['id']}}},
  {type:'function',function:{name:'bg_stop',description:'หยุด job',parameters:{type:'object',properties:{id:{type:'string'}},required:['id']}}},
  {type:'function',function:{name:'bg_pause',description:'พัก job',parameters:{type:'object',properties:{id:{type:'string'}},required:['id']}}},
  {type:'function',function:{name:'bg_resume',description:'ต่อ job',parameters:{type:'object',properties:{id:{type:'string'}},required:['id']}}},
  {type:'function',function:{name:'bg_list',description:'ลิสต์ background jobs',parameters:{type:'object',properties:{},required:[]}}},
];
const SYS = () => ({ role:'system', content:`คุณเป็นผู้ช่วยเขียนโค้ดที่เข้าถึงไฟล์ในเครื่องผู้ใช้ได้ (root = ${root}). ใช้ tool สำรวจก่อน อ่านก่อนแก้ แก้ให้น้อยที่สุด สรุปเป็นภาษาไทย.
⏱️ ทุกครั้งที่รับงานใหม่ ก่อนลงมือ ให้เรียก notify 1 ครั้งก่อนเสมอ: (1) วิเคราะห์งานสั้นๆ (2) ประเมินเวลาที่จะใช้.
🔄 งานยาว (build/ติดตั้ง/สคริปต์) ให้ bg_start เป็น background แล้ว bg_status ดูว่าใกล้เสร็จยัง · bg_pause/bg_resume/bg_stop · notify อัปเดตเป็นระยะ.` });

// ---- chat UI + loop ----
function add(cls, html){ const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html; $('chat').appendChild(d); $('chat').scrollTop=1e9; return d; }
function fmt(t){ return esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>`<pre class="code">${esc(c)}</pre>`).replace(/`([^`\n]+)`/g,'<code style="background:#232a3d;color:#9fd0ff;padding:1px 5px;border-radius:4px">$1</code>'); }
async function send(){
  if(!root){ alert('เลือกโฟลเดอร์ก่อน'); return; }
  const text=$('inp').value.trim(); if(!text) return;
  if($('chat').querySelector('.hint')) $('chat').innerHTML='';
  $('inp').value=''; add('user', esc(text));
  if(!messages.length) messages.push(SYS());
  messages.push({role:'user',content:text});
  $('sendBtn').disabled=true;
  const thinking=add('acts','⏳ กำลังทำงาน...'); const steps=[];
  try{
    for(let i=0;i<40;i++){
      steps.push('💭 คิด (รอบ '+(i+1)+')'); thinking.textContent='⏳ '+steps.slice(-7).join('\n');
      const d = await fetch(serverUrl+'/api/llm',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({messages,tools:TOOLS})}).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      setQ(d.used, d.quota);
      const m=d.message; messages.push(m);
      if(!m.tool_calls || !m.tool_calls.length){ thinking.remove(); add('bot', fmt(m.content||'(จบ)')); break; }
      for(const tc of m.tool_calls){
        let out; try{ out=runTool(tc.function.name, JSON.parse(tc.function.arguments||'{}')); }catch(e){ out='ERROR: '+e.message; }
        steps.push('🔧 '+tc.function.name+' '+(JSON.parse(tc.function.arguments||'{}').path||JSON.parse(tc.function.arguments||'{}').command||'')); thinking.textContent='⏳ '+steps.slice(-7).join('\n');
        messages.push({role:'tool',tool_call_id:tc.id,content:String(out)});
      }
      if(i===39){ thinking.remove(); add('bot','(หยุดที่ 40 รอบ)'); }
    }
  }catch(e){ thinking.textContent='❌ '+e.message; }
  $('sendBtn').disabled=false;
}
$('inp').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
</script>
</body>
</html>
